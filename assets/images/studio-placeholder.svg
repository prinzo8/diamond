<!-- Archivo Nocturno: marcador visual reemplazable por imágenes destacadas de WordPress. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Marcador de imagen Zion Tattoo Family</title>
  <desc id="desc">Composición abstracta en negro, petróleo e ivory.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1E4C4D"/><stop offset="1" stop-color="#0C0D0D"/></linearGradient>
    <pattern id="l" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 1H44" stroke="#F1E9DA" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#g)"/>
  <rect width="1200" height="800" fill="url(#l)"/>
  <circle cx="600" cy="400" r="170" fill="none" stroke="#B29A5E" stroke-width="2" stroke-opacity=".7"/>
  <path d="M500 305h200l-60 95 60 95H500l60-95z" fill="#F1E9DA" fill-opacity=".82"/>
  <path d="M490 400h220" stroke="#B29A5E" stroke-width="4"/>
